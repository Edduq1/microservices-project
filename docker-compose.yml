version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cache_redis
    restart: always
    ports:
      - "6379:6379"

  auth-service:
    image: auth-service:1.0
    build: ./microservices-lab/auth-service 
    container_name: auth_service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./microservices-lab/auth-service:/app
    environment:
      - DEBUG=1
      - DB_HOST=postgres
      - DB_NAME=main_db
      - DB_USER=devuser
      - DB_PASS=devpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  blog-service:
    image: blog-service:1.0
    build: ./microservices-lab/blog-service 
    container_name: blog_service
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./microservices-lab/blog-service:/app
    environment:
      - DEBUG=1
      - DB_HOST=postgres
      - DB_NAME=main_db
      - DB_USER=devuser
      - DB_PASS=devpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      
volumes:
  pgdata: